- name: Gather Cisco IOS facts and print hostname/version
  hosts: all
  gather_facts: false
  connection: network_cli

  vars:
    ansible_network_os: ios

  tasks:
    - name: Gather IOS facts
      cisco.ios.ios_facts:
        gather_subset: all

    - name: Display device hostname and OS version
      ansible.builtin.debug:
        msg: "Hostname={{ ansible_net_hostname }} OS Version={{ ansible_net_version }}"

    - name: Show hostname and OS version
      ansible.builtin.debug:
        msg: "Hostname={{ ansible_net_hostname }} OS Version={{ ansible_net_version }}"
        
    - name: Display all gathered facts
      ansible.builtin.debug:
        msg:
          - "Device  : {{ ansible_net_hostname }}"
          - "Version : {{ ansible_net_version }}"
          - "Model   : {{ ansible_net_model | default('N/A') }}"
          - "Serial  : {{ ansible_net_serialnum | default('N/A') }}"
